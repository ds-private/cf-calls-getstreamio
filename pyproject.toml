[project]
name = "cf-calls-getstreamio"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "dhilipsiva", email = "dhilipsiva@pm.me" }
]
dependencies = [
    "requests>=2.32.3",
    "flask>=3.0.3",
    "flask-cors>=5.0.0",
    "six>=1.16.0",
    "protobuf>=5.28.2",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "python-lsp-server[all]>=1.12.0",
    "isort>=5.13.2",
    "black>=24.8.0",
    "ipython>=8.27.0",
    "mypy>=1.11.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["cfcalls"]
